name: Test Suite

on:
  push:
    branches: [ main, dev*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clique_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-asyncio pytest-cov

    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/clique_test" >> $GITHUB_ENV
        echo "DIRECT_URL=postgresql://postgres:postgres@localhost:5432/clique_test" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "JWT_SECRET_KEY=test-jwt-secret-for-ci" >> $GITHUB_ENV

    - name: Generate Prisma client
      run: |
        prisma generate

    - name: Run database migrations
      run: |
        prisma db push --force-reset

    - name: Run linting
      run: |
        ruff check . --output-format=github

    - name: Run tests with coverage
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Test social auth routes specifically
      run: |
        pytest tests/api/socials/test_social_auth_routes.py -v

    - name: Test social platform connector
      run: |
        pytest tests/api/socials/test_social_platform_connector.py -v

    - name: Test social data fetcher
      run: |
        pytest tests/api/socials/test_social_data_fetcher.py -v